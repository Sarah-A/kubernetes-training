version: '3.8' # Use version 3.8 of the Docker Compose file format

services:
  backend-service:   
    build:
      context: ./backend
      dockerfile: Dockerfile    
    container_name: my-k8s-app-backend
    ports:
      - "5027:80" # Expose port 5027 for the backend service
    environment:
      - ASPNETCORE_URLS=http://+:80
  frontend-service:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: my-k8s-app-frontend
    ports:
      - "3000:3000" # Expose port 5028 for the frontend service
    depends_on:
      - backend-service